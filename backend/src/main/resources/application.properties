# =======================================
# PRODUCTION CONFIGURATION
# application-prod.properties
# =======================================

# =======================================
# DATABASE CONNECTION (Production)
# =======================================
# Use environment variables for security
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pharmacy_1db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =======================================
# JPA/HIBERNATE CONFIGURATION (Production)
# =======================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =======================================
# DISABLE SQL LOGGING (Production)
# =======================================
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# =======================================
# PRODUCTION LOGGING LEVELS
# =======================================
logging.level.root=WARN
logging.level.com.example.pharmacy=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN

# =======================================
# HIBERNATE PERFORMANCE (Production)
# =======================================
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.connection.pool_size=20

# =======================================
# CONNECTION POOL (Production)
# =======================================
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true

# =======================================
# SERVER CONFIGURATION (Production)
# =======================================
server.port=${SERVER_PORT:8082}
server.compression.enabled=true
server.compression.min-response-size=1024

# =======================================
# SECURITY (Production)
# =======================================
debug=false
spring.jpa.open-in-view=false

# =======================================
# JSON CONFIGURATION (Production)
# =======================================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=NON_NULL

# =======================================
# FILE UPLOAD LIMITS (Production)
# =======================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =======================================
# TIME ZONE (Production)
# =======================================
spring.jackson.time-zone=Asia/Colombo
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Colombo

# =======================================
# ACTUATOR (Production Monitoring)
# =======================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
